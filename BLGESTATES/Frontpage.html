<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>BLGE ESTATES</title>
    <style>
        /* Chatgpt hjälpte oss med att sätta färg på pilarna */
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            filter: invert(29%) sepia(94%) saturate(7485%) hue-rotate(211deg) brightness(93%) contrast(101%);
        }
    </style>
</head>

<body class="bg-primary bg-opacity-10">
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark fixed-top">

        <div class="container-fluid">
            <!-- Links -->
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="./Frontpage.html">Hem</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./FAQ.html">Om Oss</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./Tjanster.html">Tjänster</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="./Bostader.html">Bostäder</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Kontakt</a>
                </li>
            </ul>
        </div>
    </nav>
    <header>
        <div class="pt-2"></div>
    </header>
    <main class="pt-5">
        <div class="container">
            <h1 class="text-center fw-bold mt-4">Bostäder Till Salu</h1>
            <div class="carousel-indicators view-button" data-id="2">
                <button type="button" data-bs-target="#bostadCarousel" data-bs-slide-to="0" class="active bg-primary"></button>
                <button type="button" data-bs-target="#bostadCarousel" data-bs-slide-to="1" class="bg-primary"></button>
                <button type="button" data-bs-target="#bostadCarousel" data-bs-slide-to="2" class="bg-primary"></button>
            </div>
            <div id="bostadCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner" id="carousel-inner">
                    <!--här kommer carousel items-->
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#bostadCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon view-button" data-id="1"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#bostadCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon view-button" data-id="1"></span>
            </button>
            <div class="text-center fixed-bottom mb-5">
                <button type="button" class="btn btn-outline-primary">
                    <a class="btn text-primary" href="./Bostader.html">Till Alla Bostäder</a>
                </button>
            </div>
        </div>
        <div class="modal fade" id="bostadModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Bostad</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body" id="bostaddetaljer">
                        <!-- Modalen blir ifylld av javascriptkoden här -->
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p></p>
    </footer>
    <script type="module">
        //för kunna skapa olika mvc objekt måste vi importerat dessa klasser.
        import { ModelBostad } from "./Modelbostad.js";
        import { ViewBostad } from "./Viewbostad.js";
        import { ControllerBostad } from "./Controllerbostad.js";
        //initierar MVC
        document.addEventListener("DOMContentLoaded", () => {
            //efter att importerat kan vi instansierar mvc objekten.
            const model = new ModelBostad();
            const view = new ViewBostad();
            const controller = new ControllerBostad(model, view);
        });
    </script>
</body>

</html>
