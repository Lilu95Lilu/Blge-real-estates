  <title>BLGE ESTATES</title>
</head>
<!-- sätter bakgrundsfärg på sidan och i navbar-->
<body class="bg-opacity-10 bg-primary">
  <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
<!-- navbar skapas med länkar till de andra sidorna-->
    <div class="container-fluid">
      <!-- Länkar -->
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="./Frontpage.html">Hem</a>
        </li>
        <li class="nav-item">

        <li class="nav-item">
          <a class="nav-link" href="#">Kontakt</a>
        </li>
      </ul>
    </div>
  </nav>
  <!-- Header med titel-->
  <header>
    <h1 class="text-center m-4 fw-bold">Våra Bostäder</h1>
  </header>
  <main>
    <div id="bostad" class="container">
      <!-- Här kommer bostäderna att visas -->
    </div>
    <!-- Mall till modalen från w3schools -->
    <div class="modal fade" id="bostadModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Bostad</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="bostaddetaljer">
            <!-- Modalen blir ifylld av javascriptkoden här -->
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <p></p>
  </footer>
  <script type="module">
    //för kunna skapa olika mvc objekt måste vi importerat dessa klasser.
    import { ModelBostad } from "./Modelbostad.js";
    import { ViewBostad } from "./Viewbostad.js";
    import { ControllerBostad } from "./Controllerbostad.js";
    //initierar MVC
    document.addEventListener("DOMContentLoaded", () => {
      //efter att importerat kan vi instansierar mvc objekten.
      const model = new ModelBostad();
      const view = new ViewBostad();
      const controller = new ControllerBostad(model, view);
    });
  </script>
</body>
